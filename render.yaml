services:
  - type: web
    name: resapp-chatbot
    env: python
    rootDir: chatbot
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: RENDER_URL
        sync: false
